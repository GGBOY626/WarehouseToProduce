services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse_app
      MYSQL_PASSWORD: warehouse_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports: ["3306:3306"]
    volumes: [mysql_dev_data:/var/lib/mysql]
volumes:
  mysql_dev_data:
