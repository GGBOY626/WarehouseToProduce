# warehouseflow.tech 最终 HTTPS 配置。
# 首次签发证书前请先启用同目录下的 warehouse-http.conf。
server {
    listen 80;
    listen [::]:80;
    server_name warehouseflow.tech www.warehouseflow.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://warehouseflow.tech$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warehouseflow.tech www.warehouseflow.tech;

    ssl_certificate /etc/letsencrypt/live/warehouseflow.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warehouseflow.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
