# 如使用宿主机 nginx 提供 HTTPS，可将证书配置在此层；容器内 frontend 已负责静态文件和 API 转发。
server {
    listen 80;
    server_name warehouse.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name warehouse.example.com;
    ssl_certificate /etc/letsencrypt/live/warehouse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warehouse.example.com/privkey.pem;
    location / { proxy_pass http://127.0.0.1:8088; proxy_http_version 1.1; proxy_request_buffering off; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; client_max_body_size 12m; }
}
